<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meeting-booking-room</title>
    <!--
      Apply the stored theme before the first paint to prevent a flash of
      incorrect colour scheme. Mirrors the logic in src/hooks/use-theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // FullCalendar v7 can emit this harmless browser diagnostic after rendering.
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.message === 'ResizeObserver loop limit exceeded' ||
            event.message ===
              'ResizeObserver loop completed with undelivered notifications.'
          ) {
            event.stopImmediatePropagation()
          }
        },
        true,
      )
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
